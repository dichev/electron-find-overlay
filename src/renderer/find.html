<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="./find.css" />
  <script type="module" src="./FindBar.js"></script>
</head>
<body>
  <find-bar>
    <input id="q" placeholder="Find" spellcheck="false" />
    <span id="count" aria-live="polite"></span>
    <span class="divider"></span>
    <button id="prev" title="Previous (Shift+Enter)">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 10L8 5.5l4.5 4.5"/></svg>
    </button>
    <button id="next" title="Next (Enter)">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 6L8 10.5 12.5 6"/></svg>
    </button>
    <button id="close" title="Close (Esc)">
      <svg viewBox="0 0 16 16" width="13" height="13"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </find-bar>
</body>
</html>
